[tox]
envlist = {py38, py39, py310}-django{40}, docs

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings

deps=
    django-webtest
    requests-mock
    coverage

commands=
    coverage run runtests.py memberaudit -v 2 --noinput
    coverage xml
    coverage report -m

[testenv:docs]
description = invoke sphinx-build to build the HTML docs
skip_install = True
deps = -r{toxinidir}/docs/requirements.txt
install_command = python -I -m pip install {opts} {packages}
commands =
    sphinx-build -d "{toxworkdir}/docs_doctree" docs "{toxworkdir}/docs_out" --color -W -bhtml {posargs}
