; spellchecker: disable

[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E501, W503

[tox]
envlist = {py310, py311, py312}-django{42, 52}, pylint

[testenv]
setenv =
    django42: DJANGO_SETTINGS_MODULE = testauth.settings_aa4.local
    django52: DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local

deps =
    django42: allianceauth<5
    django52: allianceauth>=5,<6

extras =
    test

commands_pre=
    pip list

commands=
    python -V
    coverage run runtests.py memberaudit -v=2 --noinput
    coverage xml
    coverage report -m

[testenv:docs]
description = invoke sphinx-build to build the HTML docs
; skip_install = True
deps = -r{toxinidir}/docs/requirements.txt
; install_command = python -I -m pip install {opts} {packages}
commands =
    sphinx-build -d "{toxworkdir}/docs_doctree" docs "{toxworkdir}/docs_out" --color -W -bhtml {posargs}


[testenv:pylint]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa4.local

deps=
    allianceauth<5
    pylint
    pylint-django
    ; tblib
    ; Redis

commands=
    pylint --load-plugins pylint_django memberaudit
