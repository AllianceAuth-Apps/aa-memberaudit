{% load i18n %}

<div
    class="modal fade"
    id="removeCharacterModal"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    aria-labelledby="staticBackdropLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{% translate "Remove Character" %}</h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                >
                </button>
            </div>
            <div class="modal-body">
                {% blocktranslate trimmed %}
                    <p>Are you sure you want to remove <strong id="characterName">this character</strong> with all it's data?</p>
                {% endblocktranslate %}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    {% translate "Cancel" %}
                </button>
                <form
                    id="removeCharacterForm"
                    method="post"
                    action="{% url 'memberaudit:remove_character' 0 %}"
                >
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">{% translate "Remove" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
